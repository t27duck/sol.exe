# Dependency updates. Everything here is a dev dependency -- the built app ships no runtime
# packages at all -- so routine bumps are grouped into a single pull request to keep the noise
# down, and only major versions arrive on their own where they need a proper look.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: Bump

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: Bump
